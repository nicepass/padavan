name: Build Padavan (with Node & Go & Ubuntu 18.04 container)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [XY-C1]
        toolchain: [mipsel-linux-musl]

    steps:
      # -----------------------------
      # Step 1: Checkout repository
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------
      # Step 2: Install Node.js 20 (宿主机)
      # -----------------------------
      - name: Setup Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # -----------------------------
      # Step 3: Install Go 1.23 (宿主机)
      # -----------------------------
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.23.0

      # -----------------------------
      # Step 4: Optional plugin build (Node/Go)
      # -----------------------------
      - name: Build Third-Party Plugins
        run: |
          echo ">>> 如需构建第三方插件，请在此加入命令"
          # 示例：
          # npm install --prefix thirdparty/ui
          # npm run build --prefix thirdparty/ui
          # go build -o thirdparty/bin/app thirdparty/cmd/main.go

      # -----------------------------
      # Step 5: Add 8GB Swap (修复内核 OOM)
      # -----------------------------
      - name: Add 8GB Swap
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      # -----------------------------
      # Step 6: Build Padavan inside Ubuntu 18.04 container
      # -----------------------------
      - name: Build Padavan inside Ubuntu 18.04 container
        env:
          TARGET: ${{ matrix.target }}
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          docker run --rm \
            -v $PWD:/src \
            -w /src \
            -e TARGET=$TARGET \
            -e TOOLCHAIN=$TOOLCHAIN \
            ubuntu:18.04 \
            bash -c "
              set -e

              echo '>>> 更新并安装工具链依赖'
              apt-get update
              apt-get install -y build-essential g++ gcc make git gperf bison flex \
                libtool libtool-bin autopoint gettext python3-docutils \
                zlib1g-dev liblzma-dev libssl-dev pkg-config curl wget xz-utils

              echo '>>> 开始编译 Padavan（容器内 glibc=2.27）'
              make \$TARGET TOOLCHAIN=\$TOOLCHAIN
            "

      # -----------------------------
      # Step 7: Upload firmware
      # -----------------------------
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ matrix.toolchain }}
          path: trunk/images/*.trx
