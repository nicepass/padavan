name: Build Padavan (Fully Isolated Ubuntu 18.04 RootFS Build)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [XY-C1]
        toolchain: [mipsel-linux-musl]

    steps:
      # -----------------------------
      # Step 1: Checkout
      # -----------------------------
      - name: Checkout Repo
        uses: actions/checkout@v4

      # -----------------------------
      # Step 2: Install Node.js 20
      # -----------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # -----------------------------
      # Step 3: Install Go 1.23
      # -----------------------------
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.23.0

      # -----------------------------
      # Step 4: Build Plugins (optional)
      # -----------------------------
      - name: Build Third-Party Plugins
        run: |
          echo ">>> 如需构建第三方插件，在此添加命令"
          # 示例：
          # npm install --prefix thirdparty/ui
          # npm run build --prefix thirdparty/ui
          # go build -o thirdparty/app thirdparty/cmd/main.go

      # -----------------------------
      # Step 5: Add Swap
      # -----------------------------
      - name: Add 8GB Swap
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      # -----------------------------
      # Step 6: Create Ubuntu 18.04 Container
      # -----------------------------
      - name: Create Ubuntu 18.04 container
        run: |
          docker pull ubuntu:18.04
          docker create --name padavan ubuntu:18.04 sleep infinity

      # -----------------------------
      # Step 7: Copy source into container
      # -----------------------------
      - name: Copy source into container
        run: |
          docker cp . padavan:/src

      # -----------------------------
      # Step 8: Execute build inside container
      # -----------------------------
      - name: Build Padavan inside isolated rootfs
        env:
          TARGET: ${{ matrix.target }}
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          docker start padavan
          docker exec padavan bash -c "
            set -e

            echo '>>> Install build dependencies in container'
            apt-get update
            apt-get install -y build-essential g++ gcc make git gperf bison flex \
              libtool libtool-bin autopoint gettext python3-docutils \
              zlib1g-dev liblzma-dev libssl-dev pkg-config curl wget xz-utils

            cd /src

            echo '>>> Start Padavan build (isolated environment, glibc=2.27)'
            make \$TARGET TOOLCHAIN=\$TOOLCHAIN
          "

      # -----------------------------
      # Step 9: Copy firmware out of container
      # -----------------------------
      - name: Copy firmware out
        run: |
          mkdir -p firmware
          docker cp padavan:/src/trunk/images ./firmware

      # -----------------------------
      # Step 10: Upload Artifact
      # -----------------------------
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ matrix.toolchain }}
          path: firmware/*.trx
