name: Build Padavan (Correct Node + Go + Container Layout)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [XY-C1]
        toolchain: [mipsel-linux-musl]

    steps:
      # -----------------------------
      # Step 1: Checkout
      # -----------------------------
      - uses: actions/checkout@v4

      # -----------------------------
      # Step 2: Install Node.js 20 on host
      # -----------------------------
      - name: Setup Node.js 20
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # -----------------------------
      # Step 3: Install Go 1.23 on host
      # -----------------------------
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.23.0

      # -----------------------------
      # optional：Node/Go 插件构建（宿主机）
      # -----------------------------
      - name: Build Third-Party Plugins
        run: |
          echo ">>> 构建 Node/Go 插件（如果需要）"
          # 示例：
          # npm install --prefix thirdparty/webui
          # npm run build --prefix thirdparty/webui
          # go build -o thirdparty/app cmd/main.go

      # -----------------------------
      # Step 4: Add 8GB Swap（内核大编译）
      # -----------------------------
      - name: Add 8GB Swap
        run: |
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      # -----------------------------
      # Step 5: Build Padavan inside Ubuntu 18.04 container
      # -----------------------------
      - name: Build Padavan inside Ubuntu 18.04 container
        run: |
          docker run --rm \
            -v $PWD:/src \
            -w /src \
            ubuntu:18.04 \
            bash -c "
              set -e
              apt-get update
              apt-get install -y build-essential g++ gcc make git gperf bison flex \
                libtool libtool-bin autopoint gettext python3-docutils \
                zlib1g-dev liblzma-dev libssl-dev pkg-config curl wget xz-utils

              echo '>>> 开始编译 Padavan'
              make ${TARGET} TOOLCHAIN=${TOOLCHAIN}
            "
        env:
          TARGET: ${{ matrix.target }}
          TOOLCHAIN: ${{ matrix.toolchain }}

      # -----------------------------
      # Step 6: Upload Firmware
      # -----------------------------
      - name: Upload Firmware
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-${{ matrix.toolchain }}
          path: trunk/images/*.trx
